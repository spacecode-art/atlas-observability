route:
  receiver: "default"
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: "slack-critical"
      repeat_interval: 1h
    - matchers:
        - severity="warning"
      receiver: "slack-warning"
      repeat_interval: 4h

receivers:
  - name: "default"
    # Catches anything unmatched/unlabeled — intentionally silent so
    # a rule missing a severity label fails loud in review, not by
    # spamming Slack with an unformatted alert.

  - name: "slack-critical"
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        send_resolved: true
        title: '🚨 [CRITICAL] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

  - name: "slack-warning"
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        send_resolved: true
        title: '⚠️ [WARNING] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alert-rules.yml"

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # Collector self-telemetry — port was exposed to the host in the
  # earlier fix(otel-collector) commit but never actually scraped by
  # Prometheus, so otelcol_receiver_accepted_* never made it past a
  # manual curl. Wired here to feed the Pipeline Health row.
  - job_name: "otel-collector-self"
    static_configs:
      - targets: ["otel-collector:8888"]